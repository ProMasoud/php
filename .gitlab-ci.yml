.docker_login: &docker_login |
  docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" $CI_REGISTRY

stages:
  - build

build:
  stage: build
  image: docker

  services:
    - docker:dind

  # Define matrix for PHP versions
  script:
    - *docker_login
    - docker pull $CI_REGISTRY_IMAGE/${PHP_VERSION} || true
    - if [[ "$ARCH" == "arm" ]]; then export IMAGE_NAME=${PHP_VERSION}-arm; else export IMAGE_NAME=${PHP_VERSION}; fi
    - docker build --pull -t $CI_REGISTRY_IMAGE/${IMAGE_NAME} --build-arg="VERSION=${PHP_VERSION}" -f ./Dockerfile .
    - docker push $CI_REGISTRY_IMAGE/${IMAGE_NAME}
  parallel:
    matrix:
      - PHP_VERSION: ["8.1", "8.2", "8.3"]
        ARCH: ["arm", "amd"]

  tags:
    - saas-linux-small-${ARCH}64
  only:
    - main
