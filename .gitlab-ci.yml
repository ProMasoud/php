.docker_login: &docker_login |
  docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" $CI_REGISTRY

stages:
  - build

app-production:
  image: docker
  stage: build
  services:
    - docker:dind
  before_script:
    - *docker_login
  script:
    - docker buildx build --platform linux/amd64,linux/arm64 --pull -t "$CI_REGISTRY_IMAGE" -f ./Dockerfile .
    - docker push "$CI_REGISTRY_IMAGE"



