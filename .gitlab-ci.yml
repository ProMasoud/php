#     - docker push "$CI_REGISTRY_IMAGE:8.2"

app-production:
  image: docker
  stage: build
  services:
    - docker:dind
  before_script:
    - *docker_login
  script:
    - docker build --pull -t "$CI_REGISTRY_IMAGE:8.2" -f ./Dockerfile .
    - docker push "$CI_REGISTRY_IMAGE:8.2"

app-production-arm:
  image: docker
  stage: build
  services:
    - docker:dind
  before_script:
    - *docker_login
  script:
    - docker build --pull -t "$CI_REGISTRY_IMAGE:8.2-arm" -f ./Dockerfile .
    - docker push "$CI_REGISTRY_IMAGE:8.2-arm"
  tags:
    - arm
