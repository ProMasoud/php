.docker_login: &docker_login |
  docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" $CI_REGISTRY

stages:
  - build

# app-production:
#   image: docker
#   stage: build
#   services:
#     - docker:dind
#   before_script:
#     - *docker_login
#     - docker buildx create --name multiarch --use
#   script:
#     - docker buildx build --platform linux/amd64,linux/arm64 --pull -t "$CI_REGISTRY_IMAGE" -f ./Dockerfile .
#     - docker push "$CI_REGISTRY_IMAGE"

build:
  stage: build
  image: docker

  services:
    - docker:dind

  # Define matrix for PHP versions
  script:
    - *docker_login
    - docker pull $CI_REGISTRY_IMAGE/${PHP_VERSION} || true
    - docker build --pull -t $CI_REGISTRY_IMAGE/${PHP_VERSION} --build-arg="VERSION=${PHP_VERSION}" --platform ${ARCH} -f ./Dockerfile .
    - docker push $CI_REGISTRY_IMAGE/${PHP_VERSION}  
  parallel:
    matrix:
      - PHP_VERSION: ["8.1", "8.2"]
        ARCH: ["linux/amd64", "linux/arm64"]

  only:
    - main



