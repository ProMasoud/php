build:
  stage: build
  image: docker:19.03.12  # Use Docker image for GitLab CI/CD

  services:
    - docker:19.03.12-dind  # Use Docker-in-Docker service

  # Define matrix for PHP versions
  script:
    - |
      # for PHP_VERSION in $PHP_VERSIONS; do
        echo "${PHP_VERSION}"
        docker build -t $CI_REGISTRY_IMAGE/${PHP_VERSION} --build-arg="VERSION=${PHP_VERSION}" -f ./Dockerfile .
        docker push $CI_REGISTRY_IMAGE/${PHP_VERSION}
      # done
  
  parallel:
    matrix:
      - PHP_VERSION: ["8.1", "8.2"]

  only:
    - main



