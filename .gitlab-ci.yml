.docker_login: &docker_login |
  docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" $CI_REGISTRY

stages:
  - build

app-production:
  image: docker
  stage: build
  services:
    - docker:dind
  before_script:
    - *docker_login
  script:
    - docker build --pull -t "$CI_REGISTRY_IMAGE/8.1" -f ./Dockerfile .
    - docker push "$CI_REGISTRY_IMAGE/8.1"

app-production-arm:
  image: docker
  stage: build
  services:
    - docker:dind
  before_script:
    - *docker_login
  script:
    - docker build --pull -t "$CI_REGISTRY_IMAGE/8.1-arm" -f ./Dockerfile .
    - docker push "$CI_REGISTRY_IMAGE/8.1-arm"
  tags:
    - arm